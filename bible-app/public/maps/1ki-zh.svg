<svg viewBox="0 0 720 580" width="100%" height="580" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="580" fill="#fbf6ea"/>

  <!-- Mediterranean Sea, running the full coast past Tyre down to Judah -->
  <path d="M0,0 C34,-5 60,22 54,58 C48,92 32,108 40,130 C40,118 68,142 60,190 C50,250 70,320 55,390 C45,450 65,510 40,560 L0,560 Z"
        fill="#dce8ec" stroke="#2c5f7c" stroke-width="2.5"/>
  <text x="28" y="195" text-anchor="middle" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-size="15" fill="#2c5f7c">
    <tspan x="28" dy="0">大海</tspan>
    <tspan x="28" dy="1.15em">大海</tspan>
  </text>

  <!-- Tyre (Phoenicia) -->
  <path d="M85,18 C140,8 205,12 232,38 C250,58 244,88 212,104 C180,118 128,116 98,100 C74,86 66,52 85,18 Z"
        fill="#f1e9d8" stroke="#1c1a17" stroke-width="3"/>
  <text x="130" y="72" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="22" fill="#1c1a17">
    <tspan x="130" dy="0">推羅</tspan>
    <tspan x="130" dy="1.15em">推罗</tspan>
  </text>
  <!-- Tyre's port, where the cedar rafts set out -->
  <circle cx="110" cy="64" r="7" fill="#c97a12" stroke="#1c1a17" stroke-width="2.5"/>

  <!-- Israel (northern kingdom) -->
  <path d="M140,155 C210,140 320,145 380,168 C420,188 428,240 405,278 C388,312 345,330 295,324 C245,318 185,314 158,288 C128,262 118,205 140,155 Z"
        fill="#f1e9d8" stroke="#1c1a17" stroke-width="3"/>
  <text x="175" y="172" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="22" fill="#1c1a17">
    <tspan x="175" dy="0">以色列</tspan>
    <tspan x="175" dy="1.15em">以色列</tspan>
  </text>

  <!-- Judah (southern kingdom) -->
  <path d="M160,340 C225,332 340,336 382,356 C412,376 417,426 400,466 C384,506 338,536 288,541 C238,546 188,526 163,486 C142,446 148,380 160,340 Z"
        fill="#f1e9d8" stroke="#1c1a17" stroke-width="3"/>
  <text x="178" y="492" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="22" fill="#1c1a17">
    <tspan x="178" dy="0">猶大</tspan>
    <tspan x="178" dy="1.15em">犹大</tspan>
  </text>

  <!-- border / split between the two kingdoms -->
  <path d="M150,326 C220,314 320,316 400,332" fill="none" stroke="#1c1a17" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- Samaria marker -->
  <circle cx="300" cy="235" r="7" fill="#c97a12" stroke="#1c1a17" stroke-width="2.5"/>
  <text x="200" y="238" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="18" fill="#1c1a17">
    <tspan x="200" dy="0">撒瑪利亞</tspan>
    <tspan x="200" dy="1.15em">撒玛利亚</tspan>
  </text>

  <!-- Jerusalem marker -->
  <circle cx="278" cy="445" r="7" fill="#c97a12" stroke="#1c1a17" stroke-width="2.5"/>
  <text x="292" y="433" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="18" fill="#1c1a17">
    <tspan x="292" dy="0">耶路撒冷</tspan>
    <tspan x="292" dy="1.15em">耶路撒冷</tspan>
  </text>
  <text x="292" y="472" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-size="14" fill="#55503f">
    <tspan x="292" dy="0">聖殿</tspan>
    <tspan x="292" dy="1.15em">圣殿</tspan>
  </text>

  <!-- Dead Sea -->
  <path d="M410,430 C432,420 456,432 460,462 C464,492 440,515 415,510 C395,505 386,478 390,452 C392,440 400,435 410,430 Z"
        fill="#dce8ec" stroke="#2c5f7c" stroke-width="2.5"/>
  <text x="470" y="448" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-size="16" fill="#2c5f7c">
    <tspan x="470" dy="0">鹽海</tspan>
    <tspan x="470" dy="1.15em">盐海</tspan>
  </text>

  <!-- Cedar route: rafts of cedar and fir floated down the coast from Tyre, then hauled inland to Jerusalem (1 Kings 5:6-9) -->
  <path d="M100,70 C62,85 26,105 20,150 C14,195 24,240 18,285 C15,315 30,345 62,368 C92,390 160,418 236,440"
        fill="none" stroke="#c97a12" stroke-width="4" stroke-dasharray="2,10" stroke-linecap="round"/>
  <path d="M230,432 L246,440 L229,447 Z" fill="#c97a12" stroke="#1c1a17" stroke-width="1.5"/>
  <text x="8" y="38" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="15" fill="#a8620a">
    <tspan x="8" dy="0">香柏筏</tspan>
    <tspan x="8" dy="1.15em">香柏筏</tspan>
  </text>
  <text x="8" y="72" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="15" fill="#a8620a">
    <tspan x="8" dy="0">海路</tspan>
    <tspan x="8" dy="1.15em">海路</tspan>
  </text>
  <text x="116" y="366" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="15" fill="#a8620a">
    <tspan x="116" dy="0">陸運</tspan>
    <tspan x="116" dy="1.15em">陆运</tspan>
  </text>
  <text x="114" y="410" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="15" fill="#a8620a">
    <tspan x="114" dy="0">入城</tspan>
    <tspan x="114" dy="1.15em">入城</tspan>
  </text>

  <!-- compass -->
  <g transform="translate(70,530)">
    <circle r="26" fill="#fbf6ea" stroke="#1c1a17" stroke-width="2.5"/>
    <path d="M0,-18 L6,0 L0,18 L-6,0 Z" fill="#1c1a17"/>
    <text y="-30" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="18" fill="#1c1a17" text-anchor="middle">北</text>
  </g>

  <!-- border frame -->
  <rect x="2" y="2" width="716" height="576" fill="none" stroke="#1c1a17" stroke-width="2"/>
</svg>
